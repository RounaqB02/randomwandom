<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <title>Projectile Motion Simulation | JEE Advanced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="canvas-container"></div>
<div id="data-overlay" class="ui-overlay">
    <h3>LIVE TELEMETRY</h3>
    <p id="time-data">Time: 0.00 s</p>
    <p id="position-data">Position (x, y): (0.00, 0.00) m</p>
    <p id="velocity-data">Velocity (vx, vy): (0.00, 0.00) m/s</p>
    <p id="results-data"></p>
</div>
<div id="chart-container" class="ui-overlay">
    <canvas id="kinematics-chart"></canvas>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
